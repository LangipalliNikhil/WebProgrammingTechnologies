<!DOCTYPE html><!-- THIS DOCUMENT IS HTML-->
<html lang="en"><!-- HTML OPENING TAG // lang ="en" is called attribute its noting provide additional information i.e languaage is english-->
<head> <!-- additional data or information -->
    <meta charset="UTF-8"> <!--not imp we can remove //Configures the document to use UTF-8 character encoding. This ensures virtually all world languages, symbols, and emojis display correctly-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- A crucial tag for responsive web design. It scales the width of the page to match the screen of the device being used (mobile, tablet, or desktop).-->
    <title>First_program </title><!-- Sets the text that appears on the browser tab. -->
     <!-- Link your external CSS file here -->
    <link rel="stylesheet" href="style.css">
</head>
<body><!--Contains all the visible layout content, such as text, images, and structures-->
        <h1>Hello, World!</h1>

    <!-- Link your external JavaScript file here -->
    <script src="script.js"></script><!--: Placed right before the closing </body> tag to load JavaScript safely after the HTML elements have finished loading.-->
</body>
</html> 
<!-- SELF CLOSING TAGS IN HTML
 Tag Type	        Needs Closing Tag?	        Purpose	                                                    Examples
Self-Closing (Void)	    No	            Inserts data, metadata, or layout rules directly into the page.	    <img>, <input>, <br>, <hr>
Regular (Container)	    Yes	            Encloses content, text, or other tags.	                            <p>...</p>, <div>...</div>, <form>...</form>        -->
